<!DOCTYPE html>
<html>
<head>
  <title>Advanced Hacker Dashboard</title>

  <style>
    body {
      background: linear-gradient(135deg, #020617, #0f172a);
      color: #00ffcc;
      font-family: monospace;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      text-shadow: 0 0 20px #00ffcc;
    }

    .typing {
      border-right: 2px solid #00ffcc;
      white-space: nowrap;
      overflow: hidden;
      animation: typing 3s steps(30), blink 0.7s infinite;
    }

    @keyframes typing {
      from { width: 0 }
      to { width: 100% }
    }

    @keyframes blink {
      50% { border-color: transparent }
    }

    .stats {
      text-align: center;
      margin: 20px;
      font-size: 18px;
    }

    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(0,255,204,0.3);
      padding: 15px;
      margin: 10px;
      border-radius: 15px;
      backdrop-filter: blur(15px);
      box-shadow: 0 0 15px rgba(0,255,204,0.5);
      animation: fadeIn 0.5s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .blink {
      animation: blink2 1s infinite;
    }

    @keyframes blink2 {
      50% { opacity: 0; }
    }
  </style>
</head>

<body>

<h1 class="typing">🖥️ REAL-TIME DEVICE MONITOR <span class="blink">●</span></h1>

<div class="stats">
  📊 Total Devices Connected: <span id="count">0</span>
</div>

<div id="devices"></div>

<!-- 🔊 Sound -->
<audio id="alertSound" preload="auto">
  <source src="https://www.soundjay.com/button/sounds/beep-07.mp3" type="audio/mpeg">
</audio>

<script src="/socket.io/socket.io.js"></script>

<script>
  const socket = io(window.location.origin);
  const sound = document.getElementById("alertSound");

  let soundEnabled = false;

  // Enable sound after user click
  document.body.addEventListener("click", () => {
    soundEnabled = true;
    console.log("Sound enabled");
  });

  socket.on("update-devices", (devices) => {
    const container = document.getElementById("devices");
    const count = document.getElementById("count");

    container.innerHTML = "";
    count.innerText = devices.length;

    // 🔊 Play sound when new device connects
    if (devices.length > 0 && soundEnabled) {
      sound.currentTime = 0;
      sound.play().catch(() => {});
    }

    devices.forEach(d => {
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `
        <b>DEVICE CONNECTED</b><br><br>
        OS: ${d.platform}<br>
        SCREEN: ${d.screen}<br>
        TIME: ${d.time}
      `;
      container.appendChild(div);
    });
  });
</script>

</body>
</html>
