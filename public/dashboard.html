<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <style>
    body {
      background: #020617;
      color: #00ffcc;
      font-family: monospace;
    }

    h1 {
      text-align: center;
    }

    #map {
      height: 300px;
      margin: 20px;
    }

    .card {
      border: 1px solid #00ffcc;
      margin: 10px;
      padding: 10px;
    }
  </style>
</head>

<body>

<h1>🌍 DEVICE MONITOR</h1>

<div id="map"></div>

<div id="devices"></div>

<audio id="sound">
  <source src="https://www.soundjay.com/button/sounds/beep-07.mp3">
</audio>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="/socket.io/socket.io.js"></script>

<script>
  const socket = io(window.location.origin);
  const sound = document.getElementById("sound");

  let soundEnabled = false;

  document.body.addEventListener("click", () => {
    soundEnabled = true;
  });

  // 🌍 MAP
  const map = L.map('map').setView([20, 77], 4);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
    .addTo(map);

  socket.on("update-devices", (devices) => {
    const container = document.getElementById("devices");
    container.innerHTML = "";

    if (devices.length > 0 && soundEnabled) {
      sound.play().catch(()=>{});
    }

    devices.forEach(d => {

      // 🌍 MAP MARKER
      if (d.lat && d.lng) {
        L.marker([d.lat, d.lng]).addTo(map)
          .bindPopup(d.device);
      }

      const div = document.createElement("div");
      div.className = "card";

      div.innerHTML = `
        DEVICE: ${d.device}<br>
        SCREEN: ${d.screen}<br>
        LOCATION: ${d.lat ? d.lat.toFixed(3) + ", " + d.lng.toFixed(3) : "Not allowed"}<br>
        TIME: ${d.time}
      `;

      container.appendChild(div);
    });
  });
</script>

</body>
</html>
