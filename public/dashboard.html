<!DOCTYPE html>
<html>
<head>
  <title>Advanced Dashboard</title>
  <style>
    body {
      background: linear-gradient(135deg, #0f172a, #020617);
      color: #00ffcc;
      font-family: monospace;
      backdrop-filter: blur(10px);
    }

    h1 {
      text-align: center;
      text-shadow: 0 0 15px #00ffcc;
    }

    .stats {
      text-align: center;
      margin: 20px;
      font-size: 18px;
    }

    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(0,255,204,0.3);
      padding: 15px;
      margin: 10px;
      border-radius: 15px;
      backdrop-filter: blur(15px);
      box-shadow: 0 0 15px rgba(0,255,204,0.5);
      animation: fadeIn 0.5s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .typing {
      border-right: 2px solid #00ffcc;
      white-space: nowrap;
      overflow: hidden;
      animation: typing 2s steps(30), blink 0.7s infinite;
    }

    @keyframes typing {
      from { width: 0 }
      to { width: 100% }
    }

    @keyframes blink {
      50% { border-color: transparent }
    }
  </style>
</head>
<body>

<h1 class="typing">🖥️ REAL-TIME DEVICE MONITOR</h1>

<div class="stats">
  📊 Total Devices Connected: <span id="count">0</span>
</div>

<div id="devices"></div>

<audio id="alertSound">
  <source src="https://www.soundjay.com/button/sounds/beep-07.mp3" type="audio/mpeg">
</audio>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io(window.location.origin);
  const sound = document.getElementById("alertSound");

  socket.on("update-devices", (devices) => {
    const container = document.getElementById("devices");
    const count = document.getElementById("count");

    container.innerHTML = "";
    count.innerText = devices.length;

    if (devices.length > 0) {
      sound.play();
    }

    devices.forEach(d => {
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `
        <b>DEVICE CONNECTED</b><br><br>
        OS: ${d.platform}<br>
        SCREEN: ${d.screen}<br>
        TIME: ${d.time}
      `;
      container.appendChild(div);
    });
  });
</script>

</body>
</html>
