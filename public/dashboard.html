<!DOCTYPE html>
<html>
<head>
  <title>Hacker Dashboard</title>
  <style>
    body {
      background: black;
      color: #00ff00;
      font-family: monospace;
    }

    h1 {
      text-align: center;
      text-shadow: 0 0 20px #00ff00;
    }

    .card {
      border: 1px solid #00ff00;
      padding: 15px;
      margin: 10px;
      box-shadow: 0 0 15px #00ff00;
      animation: fadeIn 0.5s ease-in;
    }

    .blink {
      animation: blink 1s infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @keyframes fadeIn {
      from { opacity: 0 }
      to { opacity: 1 }
    }
  </style>
</head>
<body>

<h1>🖥️ SYSTEM MONITOR <span class="blink">●</span></h1>

<div id="devices"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io(window.location.origin);

  socket.on("update-devices", (devices) => {
    const container = document.getElementById("devices");
    container.innerHTML = "";

    devices.forEach(d => {
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `
        <b>DEVICE CONNECTED</b><br><br>
        OS: ${d.platform}<br>
        USER AGENT: ${d.userAgent}<br>
        SCREEN: ${d.screen}<br>
        TIME: ${d.time}
      `;
      container.appendChild(div);
    });
  });
</script>

</body>
</html>
